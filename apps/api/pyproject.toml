[project]
name = "shopflow-api"
version = "0.1.0"
description = "Production-style FastAPI backend for the ShopFlow Data Platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.1.1",
    "structlog>=26.1.0",
    "redis>=8.0.1",
    "aiokafka>=0.14.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.3.0",
    "bcrypt==4.0.1",
    "pyjwt>=2.13.0",
    "pwdlib>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mypy>=1.17.1",
]
